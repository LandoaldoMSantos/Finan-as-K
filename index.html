<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safe monkey-patch for performance.measure DataCloneError (e.g. React 19 / Scheduler / Recharts / extensions)
      (function() {
        if (typeof window !== 'undefined' && window.performance && typeof window.performance.measure === 'function') {
          var originalMeasure = window.performance.measure;
          window.performance.measure = function(name, startMarkOrOptions, endMark) {
            try {
              return originalMeasure.apply(this, arguments);
            } catch (e) {
              if (e && (e.name === 'DataCloneError' || (e.message && e.message.indexOf('clone') !== -1))) {
                try {
                  if (startMarkOrOptions && typeof startMarkOrOptions === 'object') {
                    var safeOptions = {};
                    for (var key in startMarkOrOptions) {
                      if (startMarkOrOptions.hasOwnProperty(key) && key !== 'detail') {
                        safeOptions[key] = startMarkOrOptions[key];
                      }
                    }
                    return originalMeasure.call(this, name, safeOptions, endMark);
                  }
                } catch (innerError) {
                  // ignore
                }
              }
              return undefined;
            }
          };
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      // 'light' | 'dark' | 'system' (default: follow the operating system)
      (function () {
        try {
          var pref = localStorage.getItem('theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Aplicativo completo de finanças pessoais com suporte a contas correntes, categorização hierárquica, etiquetas, transações recorrentes e importador inteligente de QIF e CSV." />
    <title>Finanças K · Gestão Financeira Pessoal</title>
  </head>
  <body>
    <noscript>O Finanças K precisa de JavaScript ativado para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
